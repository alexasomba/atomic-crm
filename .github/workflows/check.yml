name: "✅ Check"
on:
    push:
        branches:
            - main
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        name: "\U0001F52C Vite+ Check"
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            checks: write
        steps:
            - name: "\U0001F4E5 Checkout repo"
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: "⚙️ Setup node"
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  package-manager-cache: false

            - name: "Install workspace package manager"
              run: npm install --global pnpm@11.20.0

            - name: "\U0001F4E5 Download deps"
              run: pnpm install --frozen-lockfile

            - name: "\U0001F52C Check"
              run: pnpm exec vp check && pnpm exec vp run typecheck:worker

    test:
        name: "\U0001F50E Test"
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: "\U0001F4E5 Checkout repo"
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: "⚙️ Setup node"
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  package-manager-cache: false

            - name: "Install workspace package manager"
              run: npm install --global pnpm@11.20.0

            - name: "\U0001F4E5 Download deps"
              run: pnpm install --frozen-lockfile

            - name: "\U0001F3AD Install Playwright browsers"
              run: pnpm exec playwright install chromium chromium-headless-shell

            - name: "\U0001F50E Unit Tests"
              run: CI=1 pnpm exec vp test --run

            - name: "Node and worker regression tests"
              run: CI=1 pnpm exec vp run test:node

            - name: "\U0001F50E Integration Tests"
              run: CI=1 pnpm exec vp run test:integration -- --run


    build:
        name: "\U0001F528 Build"
        timeout-minutes: 10
        runs-on: ubuntu-latest
        steps:
            - name: "\U0001F4E5 Checkout repo"
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: "⚙️ Setup node"
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  package-manager-cache: false

            - name: "Install workspace package manager"
              run: npm install --global pnpm@11.20.0

            - name: "\U0001F4E5 Download deps"
              run: pnpm install --frozen-lockfile

            - name: "\U0001F528 Build"
              run: pnpm exec vp build
